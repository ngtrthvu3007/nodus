services:
  postgres:
    image: postgres:16-alpine
    container_name: nodus-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nodus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # --- Migration tooling: never started by `docker compose up`, only by `make migrate-*`, and stopped right after ---

  # Atlas CLI in a container, so nobody installs it. Official build (free, no login): it includes
  # `migrate down`, which the community build lacks.
  atlas-migrate-runner:
    image: arigaio/atlas:1.3.6
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      ATLAS_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ATLAS_DEV_URL: postgres://postgres:dev@atlas-dev-db:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Empty scratch database Atlas replays migrations on to compute diffs. In memory only; diff starts and removes it.
  atlas-dev-db:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_PASSWORD: dev
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  nodus_postgres_data:
