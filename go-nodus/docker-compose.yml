services:
  postgres:
    image: postgres:16-alpine
    container_name: nodus-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - nodus_postgres_data:/var/lib/postgresql/data

volumes:
  nodus_postgres_data:
