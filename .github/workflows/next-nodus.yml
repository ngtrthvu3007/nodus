name: next-nodus

on:
  pull_request:
    branches: [dev, main]
    paths: ["next-nodus/**", ".github/workflows/next-nodus.yml"]
  push:
    branches: [dev, main]
    paths: ["next-nodus/**", ".github/workflows/next-nodus.yml"]

permissions:
  contents: read

concurrency:
  group: next-nodus-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next-nodus

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next-nodus/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (includes type check)
        run: pnpm build
